# Smoke test of the release APK on an emulator: the app starts without a development server, and
# anyone can try it with the sample photos (loaded from Wikimedia Commons, with Gemma's prepared answers).
# Run: maestro test .maestro/smoke.yaml
appId: com.mantide.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible: "Use my gallery"
- tapOn: "Try with sample photos"
- extendedWaitUntil:
    visible: "6 countries · .*"
    timeout: 60000
- assertVisible:
    id: "map-canvas"
- waitForAnimationToEnd
- takeScreenshot: sample-photos
- assertNotVisible: "Error"

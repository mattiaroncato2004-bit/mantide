# Smoke test of the release APK on an emulator: the app starts without a development server,
# shows the welcome, and the map with its sheet works without the gallery.
# Run: maestro test .maestro/smoke.yaml
appId: com.mantide.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible: "Use my gallery"
- tapOn: "Continue without gallery"
- assertVisible:
    id: "map-canvas"
- assertVisible: "Your world"
# A short, slow pull: the sheet settles where a flick would carry it, and a long one reaches the top.
- swipe:
    start: 50%, 92%
    end: 50%, 72%
    duration: 1200
- assertVisible:
    id: "sheet-mid"
- assertVisible: "Connect your gallery"
- assertNotVisible: "Error"

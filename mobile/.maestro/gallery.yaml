# Reading the gallery on Android: the 45 demo photos are pushed to the emulator first (android.yml),
# with the emulator's location at H-FARM. Gemma isn't running, so the app must fall back to the
# answers prepared for the demo photos and say so in the place sheet.
# Run: maestro test .maestro/gallery.yaml
appId: com.mantide.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn: "Use my gallery"
- tapOn:
    text: "Allow all"
    optional: true
- extendedWaitUntil:
    visible: "6 countries · .*"
    timeout: 120000
- takeScreenshot: world-after-gallery
- tapOn: "Back to me"
# "You are here" must stay above the photo pins.
- waitForAnimationToEnd
- takeScreenshot: back-to-me
- swipe:
    start: 50%, 92%
    end: 50%, 8%
    duration: 800
- assertVisible:
    id: "sheet-high"
# The analysis starts after the thumbnails are made, then falls back on the first failed call.
- extendedWaitUntil:
    visible: ".*Gemma isn't reachable from here.*"
    timeout: 90000
- takeScreenshot: place-sheet-after-gallery

# Checks every push and pull request; on main, also publishes the web demo to GitHub Pages.
# The commands are the ones in the README's "Run it" section.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle the Android app's JavaScript
        run: npx expo export --platform android --output-dir /tmp/android-bundle
      - name: Build the web demo
        run: npm run export:web
      # Ubuntu's package mirrors are sometimes unreachable from the runner: GitHub's image already has
      # the browser's libraries, so fall back to the browser alone (the e2e still fails if one is missing).
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Test the web demo end to end
        run: npm run e2e
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/dist-web

  deploy-pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

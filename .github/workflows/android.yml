# Builds the release APK (JavaScript bundled in, signed with the debug key) and runs it on an
# Android emulator. android/ is generated by `expo prebuild` from app.json and never committed.
name: Android

on:
  push:
    branches: [main, stage-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mantide-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mantide-release-apk
          path: apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install the APK and run the smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The demo gallery goes into the emulator, located at H-FARM like the demo traveller's home.
          # Right after boot the shared storage refuses writes for a while: wait, then retry the copy.
          script: |
            adb emu geo fix 12.3766 45.6297
            sleep 30 && adb shell mkdir -p /sdcard/Pictures/mantide-demo
            for i in 1 2 3 4 5; do adb push demo-data/photos/. /sdcard/Pictures/mantide-demo/ && break; echo "push failed, retrying"; sleep 15; done; adb shell ls /sdcard/Pictures/mantide-demo | wc -l
            adb shell content call --method scan_volume --uri content://media --arg external_primary
            adb install -r apk/app-release.apk
            maestro test mobile/.maestro/smoke.yaml
            maestro test mobile/.maestro/gallery.yaml
